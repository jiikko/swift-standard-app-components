name: SwiftLint

on:
  push:
    branches: [master]
    paths:
      - "Sources/**/*.swift"
      - ".swiftlint.yml"
      - ".github/workflows/swiftlint.yml"
  pull_request:
    paths:
      - "Sources/**/*.swift"
      - ".swiftlint.yml"
      - ".github/workflows/swiftlint.yml"

# 同じブランチで連続 push されたら古い run はキャンセルする。
concurrency:
  group: swiftlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Linux runner で十分。SwiftLint は SDK / Xcode 不要 (静的解析のみ)。
    # SwiftUI を実際にコンパイルするのは test workflow (macOS) の役目。
    runs-on: ubuntu-latest
    # SwiftLint の公式 Docker image で動かす。shared-workflows は `--config` のみで `--strict` を渡せないため、本リポでは自前で実行する。
    # 以前は生の Linux バイナリ (swiftlint_linux_amd64.zip) を runner で直接動かしていたが、ubuntu-latest の image が更新されてから
    # `libxml2.so.2` が無く起動できなくなった (exit 127。2026-11-05 の run 42005093094 から全滅)。image は実行に要るライブラリを同梱するので、
    # runner の OS の更新に左右されない (DualNoteApp・ThumbnailThumb の CI と同じ方式)。
    # バージョンは他リポ (shared-workflows / 各 app の CI) と揃える (0.63.2)。上げるときは Package.swift の SwiftLintPlugins と一緒に上げる
    container: ghcr.io/realm/swiftlint:0.63.2
    steps:
      - uses: actions/checkout@v7

      # `--strict` で warning も error 扱い。`.swiftlint.yml` の severity が
      # warning のままでもこのフラグで全部 exit 2 (= job failure) になる。
      - name: Run SwiftLint (strict)
        run: swiftlint lint --strict --config .swiftlint.yml Sources
